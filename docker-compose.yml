services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vh_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-victoria_hill}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vh_user} -d ${POSTGRES_DB:-victoria_hill}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DATA_DIR: /app/data
      DATABASE_URL: postgres://${POSTGRES_USER:-vh_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-victoria_hill}?sslmode=disable
      ADMIN_USERNAME: ${ADMIN_USERNAME:-pengurus}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      RESIDENT_PASSWORD: ${RESIDENT_PASSWORD:?RESIDENT_PASSWORD is required}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY is required}
      TRUST_PROXY: "true"
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - uploads_data:/app/data/uploads

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 8080
      BACKEND_URL: http://backend:8080
    ports:
      - "80:8080"

volumes:
  pg_data:
  uploads_data:
