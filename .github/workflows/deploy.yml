name: CI/CD Deploy to Compute Engine

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test Backend & Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      - name: Run Go tests
        working-directory: backend
        run: go test -v ./...

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy to Victoria Hill VM
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync code & rebuild containers on VM
        run: |
          tar --exclude='.git' --exclude='node_modules' --exclude='frontend/dist' --exclude='backend/data' --exclude='*.xlsx' --exclude='*.zip' -czf /tmp/vh-release.tar.gz docker-compose.yml backend frontend
          scp -i ~/.ssh/deploy_key /tmp/vh-release.tar.gz "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/tmp/vh-release.tar.gz"
          ssh -i ~/.ssh/deploy_key "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" '
            set -e
            sudo tar -xzf /tmp/vh-release.tar.gz -C /opt/victoria-hill
            rm -f /tmp/vh-release.tar.gz
            cd /opt/victoria-hill
            sudo docker compose up -d --build
            sudo docker image prune -f
            curl -fsS http://localhost/api/health
          '
